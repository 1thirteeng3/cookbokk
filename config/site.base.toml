# Configuração base do site (Zensical). Editável à mão.
# tools/build_site.py acrescenta, por idioma: docs_dir, site_dir, idioma, nav e seletor de idioma.
# Site base configuration (Zensical). tools/build_site.py adds per-language settings.

[project]
site_name = "DS & AI Cookbook"
site_description = "Receitas end-to-end de ciência de dados, ML, deep learning, engenharia de dados e AI engineering."
extra_javascript = [
  "assets/javascripts/lang-switch.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.theme]
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.prune",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Modo escuro / Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Modo claro / Light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
